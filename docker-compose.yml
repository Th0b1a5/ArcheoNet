x-web-template: &web-template
  build:
    context: .
    dockerfile: Dockerfile
  expose:
    - "8501"
  labels:
    - "traefik.enable=true"
    # Tell the Load Balancer to accept traffic from your Cloudflare Worker
    - "traefik.http.routers.archeonet.rule=Host(`archeonet-proxy.example.workers.dev`) || Host(`archeonet.csproject.org`)"
    - "traefik.http.routers.archeonet.service=archeonet-cluster"
    # Configure the Load Balancer & Sticky Sessions for Streamlit
    - "traefik.http.services.archeonet-cluster.loadbalancer.server.port=8501"
    - "traefik.http.services.archeonet-cluster.loadbalancer.sticky.cookie=true"
    - "traefik.http.services.archeonet-cluster.loadbalancer.sticky.cookie.name=archeonet_session"

services:
  web-1:
    <<: *web-template
  web-2:
    <<: *web-template
  web-3:
    <<: *web-template
  web-4:
    <<: *web-template
  web-5:
    <<: *web-template
  web-6:
    <<: *web-template
  web-7:
    <<: *web-template