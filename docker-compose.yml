services:
  archeonet-web:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 7
    expose:
      - "8501"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.archeonet-web.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.archeonet-web.loadbalancer.sticky.cookie.name=archeonet_session"