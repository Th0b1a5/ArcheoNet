x-web-template: &web-template
  build:
    context: .
    dockerfile: Dockerfile
  expose:
    - "8501"
  # --- NEW: Tell Streamlit not to panic behind the Cloudflare Proxy ---
  environment:
    - STREAMLIT_SERVER_ENABLE_CORS=false
    - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
  # ------------------------------------------------------------------
  networks:
    - coolify
  labels:
    - "traefik.enable=true"
    - "traefik.docker.network=coolify"
    - "traefik.http.routers.archeonet.rule=Host(`archeonet-proxy.example.workers.dev`) || Host(`archeonet-server.csproject.org`) || Host(`archeonet.csproject.org`)"
    - "traefik.http.routers.archeonet.service=archeonet-cluster"
    - "traefik.http.services.archeonet-cluster.loadbalancer.server.port=8501"
    - "traefik.http.services.archeonet-cluster.loadbalancer.sticky.cookie=true"
    - "traefik.http.services.archeonet-cluster.loadbalancer.sticky.cookie.name=archeonet_session"

services:
  web-1:
    <<: *web-template
  web-2:
    <<: *web-template
  web-3:
    <<: *web-template
  web-4:
    <<: *web-template
  web-5:
    <<: *web-template
  web-6:
    <<: *web-template
  web-7:
    <<: *web-template

networks:
  coolify:
    external: true