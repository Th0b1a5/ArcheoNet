x-web-template: &web-template
  build:
    context: .
    dockerfile: Dockerfile
  expose:
    - "8501"
  # 1. Plug the clones into Coolify's network
  networks:
    - coolify
  labels:
    - "traefik.enable=true"
    # 2. Tell Traefik exactly which network to use to reach the clones
    - "traefik.docker.network=coolify"
    # 3. Add the -server domain so Cloudflare doesn't get a 404
    - "traefik.http.routers.archeonet.rule=Host(`archeonet-proxy.example.workers.dev`) || Host(`archeonet-server.csproject.org`) || Host(`archeonet.csproject.org`)"
    - "traefik.http.routers.archeonet.service=archeonet-cluster"
    - "traefik.http.services.archeonet-cluster.loadbalancer.server.port=8501"
    - "traefik.http.services.archeonet-cluster.loadbalancer.sticky.cookie=true"
    - "traefik.http.services.archeonet-cluster.loadbalancer.sticky.cookie.name=archeonet_session"

services:
  web-1:
    <<: *web-template
  web-2:
    <<: *web-template
  web-3:
    <<: *web-template
  web-4:
    <<: *web-template
  web-5:
    <<: *web-template
  web-6:
    <<: *web-template
  web-7:
    <<: *web-template

# Define the external Coolify network so Docker Compose knows it exists
networks:
  coolify:
    external: true